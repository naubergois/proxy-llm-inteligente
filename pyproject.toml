[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proxy-llm-inteligente"
version = "0.1.0"
description = "Intelligent LLM proxy: cache, fallback, and stigmergic swarm routing"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Francisco Nauber Bernardo Gois" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
proxy-llm = "proxy_llm.server:main"

[tool.setuptools.packages.find]
where = ["src"]
